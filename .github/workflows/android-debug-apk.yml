name: Build FLOWORA 2.0 Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor Android wrapper
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg sw.js www/
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          fs.writeFileSync('capacitor.config.json', JSON.stringify({
            appId: 'com.flowora.twopointzero',
            appName: 'FLOWORA 2.0',
            webDir: 'www',
            bundledWebRuntime: false,
            server: { androidScheme: 'https' }
          }, null, 2));
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FLOWORA-2.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
